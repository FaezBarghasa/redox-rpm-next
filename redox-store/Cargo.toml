[package]
name = "redox-store"
version = "0.1.0"
edition = "2024"
description = "Backend for hosting AI models and Game Assets on Redox OS"
authors = ["Redox OS Developers"]
license = "MIT"

[dependencies]
tokio = { version = "1.37", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "signal"] }
hyper = { version = "1.3", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
bytes = "1.5"

[lints.rust]
unsafe_code = "forbid"
